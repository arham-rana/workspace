services:
  workspace:
    build: .
    image: workspace:latest
    container_name: workspace
    restart: unless-stopped
    ports:
      - "3000:3000"
    volumes:
      - workspace-data:/data
    environment:
      # Spelling and grammar checks (the LanguageTool service below).
      LANGUAGETOOL_URL: http://languagetool:8010
      # Backups: a checked copy of the database and files every day at BACKUP_HOUR (server time), keeping BACKUP_KEEP
      # (0 turns them off). They're in /data/backups unless BACKUP_DIR points elsewhere, for example another disk:
      #   BACKUP_DIR: /backups        (and add "- /mnt/nas/notes-backups:/backups" under volumes)
      BACKUP_KEEP: "14"
      BACKUP_HOUR: "3"
    depends_on:
      - languagetool

  # Spelling and grammar checker, running on your own server (your text never leaves it).
  # The first start downloads it (about 300 MB); it uses about 1 GB of memory.
  languagetool:
    image: erikvl87/languagetool:latest
    container_name: workspace-languagetool
    restart: unless-stopped
    environment:
      Java_Xms: 256m
      Java_Xmx: 1g

volumes:
  workspace-data:
    # Your data. The name is fixed so it stays the same whatever the app's folder is called
    # (it's where earlier versions, run from a folder called notes-app, kept everything).
    name: notes-app_notes-data
